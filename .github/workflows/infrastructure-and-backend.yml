name: Infrastructure and backend validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-integration:
    name: Backend integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run backend integration suite
        env:
          COMPOSE_PROJECT_NAME: backend-integration
          POSTGRES_TEST_PORT: 54330
          TEST_DATABASE_URL: postgresql://superuser:superpassword@127.0.0.1:54330/web_app_demo_test?schema=public
        run: bun run test:backend:integration

      - name: Show PostgreSQL diagnostics
        if: ${{ always() }}
        run: docker compose -p backend-integration ps && docker compose -p backend-integration logs postgres_test

      - name: Clean up test containers
        if: ${{ always() }}
        run: docker compose -p backend-integration down -v --remove-orphans

  terraform-validation:
    name: Terraform validation (credential-free)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Terraform validation suite
        run: bun run test:terraform
